spring:
  application:
    name: financial-control-project
  datasource:
    url: ${PG_DB_URL}
    username: ${PG_DB_USERNAME}
    password: ${PG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    create-schemas: true
    default-schema: access
    schemas: access,finance
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}
    active-key-id: ${JWT_ACTIVE_KEY_ID:primary}
    previous-keys: ${JWT_PREVIOUS_KEYS:}
    issuer: ${JWT_ISSUER:cointrol-api}
    audience: ${JWT_AUDIENCE:cointrol-client}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
  login-protection:
    maximum-attempts: ${LOGIN_MAXIMUM_ATTEMPTS:5}
    attempt-window-seconds: ${LOGIN_ATTEMPT_WINDOW_SECONDS:900}
    lock-duration-seconds: ${LOGIN_LOCK_DURATION_SECONDS:900}
    retention-days: ${LOGIN_ATTEMPT_RETENTION_DAYS:30}
  audit:
    retention-days: ${SECURITY_AUDIT_RETENTION_DAYS:365}
    cleanup-cron: ${SECURITY_AUDIT_CLEANUP_CRON:0 15 3 * * *}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    maximum-tracked-keys: ${RATE_LIMIT_MAXIMUM_TRACKED_KEYS:100000}
    login:
      requests: ${RATE_LIMIT_LOGIN_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    refresh:
      requests: ${RATE_LIMIT_REFRESH_REQUESTS:30}
      window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
    registration:
      requests: ${RATE_LIMIT_REGISTRATION_REQUESTS:5}
      window-seconds: ${RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:3600}
    api:
      requests: ${RATE_LIMIT_API_REQUESTS:300}
      window-seconds: ${RATE_LIMIT_API_WINDOW_SECONDS:60}
